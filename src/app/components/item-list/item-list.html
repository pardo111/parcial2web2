<div class="grid">
  @for (item of items; track item.id) {
    <button class="flex w-full cursor-pointer items-center gap-3 border-0 border-b border-solid border-slate-100 bg-white px-4 py-3 text-left transition hover:bg-blue-50" [class.bg-blue-50]="selectedId === item.id" (click)="itemSelected.emit(item)">
      <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-blue-50 text-base text-blue-600">{{ item.category === 'Finanzas' ? '＄' : item.category === 'Soporte' ? '◉' : '▤' }}</span>
      <span class="grid min-w-0 flex-1 gap-1"><span class="overflow-hidden text-ellipsis whitespace-nowrap text-[11px] font-semibold text-slate-700">{{ item.name }}</span><span class="text-[9px] text-slate-400">{{ item.id }} · {{ item.category }}</span></span>
      <span class="whitespace-nowrap rounded bg-amber-50 px-2 py-1.5 text-[9px] text-amber-700" [class.bg-emerald-50]="item.status === 'Completado'" [class.text-emerald-700]="item.status === 'Completado'" [class.bg-slate-100]="item.status === 'Pendiente'" [class.text-slate-500]="item.status === 'Pendiente'"><i class="mr-1 inline-block size-1 rounded-full bg-amber-500" [class.bg-emerald-500]="item.status === 'Completado'" [class.bg-slate-400]="item.status === 'Pendiente'"></i>{{ item.status }}</span>
      <span class="ml-1 text-slate-400">›</span>
    </button>
  } @empty { <div class="p-8 text-center text-xs text-slate-500">No hay procesos para mostrar.</div> }
</div>
