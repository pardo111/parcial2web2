<section class="mb-6 flex justify-end">
  <button class="cursor-pointer rounded-lg border-0 bg-blue-600 px-3.5 py-2.5 text-[10px] font-semibold text-white shadow-md shadow-blue-200 max-[460px]:whitespace-nowrap" (click)="addProcess()"><span class="mr-1 text-sm">＋</span>Nuevo proceso</button>
</section>
<section class="mb-5 grid grid-cols-4 gap-3.5 max-[1050px]:grid-cols-2 max-[460px]:gap-2">
  <app-summary-card label="Total de procesos" [value]="service.total" icon="▤" iconClasses="bg-blue-50 text-blue-600" note="vs. mes anterior" trend="↗ 12.5%" />
  <app-summary-card label="En progreso" [value]="service.inProgress" icon="◷" iconClasses="bg-amber-50 text-amber-600" note="Procesos en curso" />
  <app-summary-card label="Completados" [value]="service.completed" icon="✓" iconClasses="bg-emerald-50 text-emerald-600" note="vs. mes anterior" trend="↗ 8.2%" />
  <app-summary-card label="Tiempo promedio" value="4.2" unit="días" icon="◷" iconClasses="bg-violet-50 text-violet-600" note="Tiempo de resolución" trend="↘ 2.1%" />
</section>
<section class="mb-4 grid grid-cols-[minmax(0,1.35fr)_minmax(275px,.85fr)] gap-4 max-[760px]:grid-cols-1">
  <article class="overflow-hidden rounded-xl border border-slate-200 bg-white"><div class="flex items-center justify-between border-b border-slate-100 p-4"><div><h2 class="m-0 mb-1 text-xs font-semibold text-slate-700">Procesos recientes</h2><p class="m-0 text-[9px] text-slate-400">Administra y da seguimiento a tus procesos</p></div><a class="text-[9px] font-semibold text-blue-600 no-underline" routerLink="/procesos">Ver todos →</a></div>@if (service.records$ | async; as records) {<app-item-list [items]="recordsForPage(records)" [selectedId]="selected?.id" (itemSelected)="selectItem($event)" />@if (records.length > pageSize) {<div class="flex items-center justify-between border-t border-slate-100 px-4 py-3"><span class="text-[9px] text-slate-500">Página {{ currentPage }} de {{ totalPages }}</span><div class="flex gap-2"><button type="button" class="rounded-md border border-slate-200 px-2.5 py-1.5 text-[9px] text-slate-600 disabled:cursor-not-allowed disabled:opacity-40" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">Anterior</button><button type="button" class="rounded-md border border-slate-200 px-2.5 py-1.5 text-[9px] text-slate-600 disabled:cursor-not-allowed disabled:opacity-40" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">Siguiente</button></div></div>}}</article>
  <article class="min-h-60 overflow-hidden rounded-xl border border-slate-200 bg-white"><app-item-detail [item]="selected" /></article>
</section>
